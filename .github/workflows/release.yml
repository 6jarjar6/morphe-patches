name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build patches
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Read version
        id: version
        run: |
          VERSION="$(grep -E '^version[[:space:]]*=' gradle.properties | cut -d '=' -f2 | tr -d '[:space:]')"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${VERSION}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          files: patches/build/libs/patches-*.mpp
          body: |
            Personal Morphe patch bundle.

            Add this source to Morphe: https://morphe.software/add-source?github=6jarjar6/morphe-patches
