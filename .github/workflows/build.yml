name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build patches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build patches
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: List artifacts
        run: ls -la patches/build/libs/*.mpp
