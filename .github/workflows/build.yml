name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build patches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read version
        id: version
        run: echo "tag=v$(grep -E '^version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: List artifacts
        run: ls -la patches/build/libs/*.mpp

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: patches/build/libs/*.mpp

      - name: Generate patch list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:generatePatchesList --no-daemon

      - name: Generate bundle descriptor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(grep -E '^version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          python3 - "$VERSION" <<'PY'
          import json, sys, datetime
          version = sys.argv[1]
          payload = {
            "created_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S"),
            "description": (
              "Bundle of patches for Bejeweled 3 (com.ea.gp.bej3, 4.0.0 / 3.9.1).\n"
              "- Ad-free: removes advertisement placements.\n"
              "- Crash-guard: injects null guards across the Java glue layer.\n"
              "- Privacy-disabled: disables telemetry consent tracking.\n"
              "- Telemetry-disabled: suppresses analytics/tracking endpoints and severs the "
              "Kinesis/Cognito chain before AWS-HTTP consumers.\n"
              "Developed with AI assistance; each patch statically verified at release time."
            ),
            "download_url": f"https://github.com/6jarjar6/morphe-patches/releases/download/v{version}/patches-{version}.mpp",
            "signature_download_url": "",
            "version": version,
          }
          open("patches-bundle.json", "w").write(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Commit patch metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet patches-list.json patches-bundle.json; then
            echo "metadata unchanged — nothing to commit"
          else
            git add patches-list.json patches-bundle.json
            git commit -m "chore: regenerate patch metadata"
            git push
          fi
